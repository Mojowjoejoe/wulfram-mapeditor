name: Release desktop editor

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        default: '0.6.0'

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release tag belongs to main
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${{ github.sha }}" "origin/main"
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to commits in the reviewed main history."
          }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:formats

      - name: Configure Windows code signing
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $requiresSigning = '${{ github.event_name }}' -eq 'push'
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)) {
            if ($requiresSigning) {
              throw 'Tagged public releases require WINDOWS_SIGNING_CERTIFICATE_BASE64 and WINDOWS_SIGNING_CERTIFICATE_PASSWORD.'
            }
            'WULFRAM_REQUIRE_SIGNED_DESKTOP=0' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host 'No signing certificate configured; this manual workflow artifact will be marked as an unsigned developer build.'
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'wulfram-forge-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          "WULFRAM_SIGNING_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $password = ConvertTo-SecureString $env:SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "WULFRAM_SIGNING_CERTIFICATE_SHA1=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not $certificate.HasPrivateKey) { throw 'The imported code-signing certificate has no private key.' }

          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) { throw 'SignTool was not found in the Windows SDK.' }

          'WULFRAM_REQUIRE_SIGNED_DESKTOP=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WULFRAM_SIGNTOOL_PATH=$signTool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build self-contained WebView2 app
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          npm run build:desktop -- --version $version
          $executable = 'dist/desktop/win-x64/WulframForge.exe'
          $signature = Get-AuthenticodeSignature $executable
          if ('${{ github.event_name }}' -eq 'push' -and $signature.Status -ne 'Valid') {
            throw "Tagged release executable signature is not valid: $($signature.StatusMessage)"
          }
          @(
            "Status: $($signature.Status)"
            "Signer subject: $($signature.SignerCertificate.Subject)"
            "Signer thumbprint: $($signature.SignerCertificate.Thumbprint)"
            "Timestamp subject: $($signature.TimeStamperCertificate.Subject)"
            "Timestamp thumbprint: $($signature.TimeStamperCertificate.Thumbprint)"
          ) | Set-Content -Encoding utf8 'dist/desktop/AUTHENTICODE.txt'
          Get-FileHash "dist/desktop/WulframForge-$version-win-x64-self-contained.zip", 'dist/desktop/AUTHENTICODE.txt' -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii "dist/desktop/SHA256SUMS.txt"

      - name: Remove signing certificate from runner
        if: always()
        shell: pwsh
        run: |
          if ($env:WULFRAM_SIGNING_CERTIFICATE_SHA1) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:WULFRAM_SIGNING_CERTIFICATE_SHA1" -Force -ErrorAction SilentlyContinue
          }
          if ($env:WULFRAM_SIGNING_CERTIFICATE_PATH -and (Test-Path -LiteralPath $env:WULFRAM_SIGNING_CERTIFICATE_PATH)) {
            Remove-Item -LiteralPath $env:WULFRAM_SIGNING_CERTIFICATE_PATH -Force
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WulframForge-win-x64
          path: |
            dist/desktop/WulframForge-*-win-x64-self-contained.zip
            dist/desktop/AUTHENTICODE.txt
            dist/desktop/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem "dist/desktop/WulframForge-*-win-x64-self-contained.zip", "dist/desktop/AUTHENTICODE.txt", "dist/desktop/SHA256SUMS.txt" | ForEach-Object FullName
          gh release create "${{ github.ref_name }}" $files --repo "${{ github.repository }}" --verify-tag --title "Wulfram Forge ${{ github.ref_name }}" --generate-notes
